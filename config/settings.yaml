site:
  title: ODA Newsdesk
  base_url: ""            # e.g. https://newsdesk.example.org (used in RSS links)
  cname: ""               # custom domain for GitHub Pages; empty = none

languages: [en, nl]       # items detected in other languages are dropped

embedding:
  model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  cache_dir: .cache       # model files + vector cache; persisted via actions/cache

# Items whose best aid/data-ai similarity to the track seeds is below the
# threshold are stored but hidden, and not sent to the LLM. Curated sources
# (prefilter: false) get a low bar that only drops navigation/job/author pages;
# the LLM's on_topic judgment does the rest. Tune using the Stats page.
relevance_threshold:
  curated: 0.25
  keyword: 0.40

llm:
  backend: ollama         # anthropic | ollama
  digest_backend: anthropic   # the digest workflow falls back to ollama when ANTHROPIC_API_KEY is not set
  models:
    anthropic: {enrich: claude-haiku-5-5, digest: claude-sonnet-5-5}
    # Local models run on the 4-vCPU GitHub runner (CPU only). Compare candidates with the
    # eval workflow before switching llm.backend; see README "Choosing a backend".
    ollama: {enrich: "gemma3:4b", digest: "llama3.1:8b"}
  ollama_base_url: http://localhost:11434/v1
  effort: low             # anthropic output_config.effort for enrichment
  digest_effort: medium   # anthropic output_config.effort for the weekly digest
  max_items_per_run: {anthropic: 150, ollama: 60}   # ollama: ~15-25 s per item on CPU
  concurrency: {anthropic: 4, ollama: 1}
  retry_window_days: 2    # skipped/failed items this recent are (re)tried
  max_attempts: 2
  # USD per 1M tokens [input, output], for the cost estimate on the Stats page
  pricing:
    claude-haiku-5-5: [0.10, 0.50]
    claude-sonnet-5-5: [2.00, 10.00]

fetch:
  timeout_s: 15
  retries: 2
  max_age_days: 14        # ignore entries older than this
  dead_after_failures: 3  # consecutive failed runs before a feed is flagged dead

dedupe:
  title_similarity: 92    # rapidfuzz token_sort_ratio
  title_window_days: 3
  seen_retention_days: 60

# Hot stories: visible items from the last window_days are grouped greedily. An item joins
# a cluster when its cosine similarity to the centroid is >= sim_threshold, it shares a track,
# and it shares a rare word (one in <= anchor_max_df of the last 30 days' items). Tuned on
# real data: 0.82 found nothing; below 0.70 unrelated "aid cuts" stories merge.
hot:
  window_days: 7
  sim_threshold: 0.70
  anchor_max_df: 0.05
  min_sources: 3          # distinct publishers for a story to be "hot"
  rising_velocity: 2      # new publishers in 24h for a "rising" badge
  max_llm_per_run: 20     # hot clusters (re)described per run; cached until membership changes

# Items dropped at fetch time and hidden if already stored. Publishers are the ids shown
# in data/items (slug of the Google News publisher name for catch-all queries). Domains
# also match their subdomains; use them for aggregators that repost other outlets' news.
# Title patterns are case-insensitive regexes; the LLM's on_topic check catches the rest.
exclude:
  publishers:
    - vietnam-vn          # machine-translated Vietnamese state media in the NL Google News results
    - head-topics
    - drimble
  domains:
    - headtopics.com      # reposts other outlets' stories, often as mixed local-news roundups
    - drimble.nl          # Dutch news aggregator
    - news.lavx.hu        # AI-rewritten news feed
    - dagens.com          # content farm
    - indiagazette.com    # syndicated reposts (Big News Network)
  title_patterns:
    - '\bvacature'
    - '\bvacanc(y|ies)\b'
    - '\bjob (opening|vacancy|posting)'
    - '\bwe(''re| are) hiring\b'
    - '\b\d+\s*(uur|hours) per (week|wk)\b'
    - '\((m/v|m/v/x|m/f|m/f/d|v/m)\)'
    - '\bcareer hub\b'

site_window_days: 30      # items exported to recent.json
