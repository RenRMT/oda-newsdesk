# Fields:
#   id, name, lang (en | nl)
#   type: rss      -> url
#         gnews    -> q (Google News search; "when:14d" and locale are added from lang)
#         reliefweb-> query (ReliefWeb API v2; needs an approved RELIEFWEB_APPNAME)
#   tracks: default track hints (aid, data-ai, nl)
#   prefilter: false -> source is on-topic by nature, skip keyword filter (default true)
#   weight: ranking / hot-score weight (generic aggregator queries 0.5)
#   publisher: id used to count independent sources. Defaults to the source id;
#              for gnews sources without it, the publisher is taken per item.
#   enabled: false to switch off without deleting
#
# Sites that block feed readers (403) or have no working feed are read through a
# Google News `site:` query. Those items have no excerpt, only a title.

# --- Aid / humanitarian -------------------------------------------------------
- id: reliefweb-policy
  name: ReliefWeb – policy & analysis
  type: rss
  url: https://reliefweb.int/updates/rss.xml?search=%28localisation+OR+%22aid+cuts%22+OR+%22humanitarian+reset%22+OR+%22anticipatory+action%22+OR+%22grand+bargain%22+OR+evaluation%29
  lang: en
  tracks: [aid]
  prefilter: false
  publisher: reliefweb
  weight: 0.8
- id: reliefweb-data
  name: ReliefWeb – data & AI
  type: rss
  url: https://reliefweb.int/updates/rss.xml?search=%28%22artificial+intelligence%22+OR+%22machine+learning%22+OR+%22humanitarian+data%22+OR+%22data+responsibility%22+OR+%22predictive+analytics%22%29
  lang: en
  tracks: [aid, data-ai]
  prefilter: false
  publisher: reliefweb
  weight: 0.8
- id: reliefweb-api
  name: ReliefWeb API
  type: reliefweb
  query: '(policy OR analysis OR evaluation OR funding OR "aid cuts" OR localisation OR "anticipatory action")'
  lang: en
  tracks: [aid]
  prefilter: false
  weight: 0.8
  enabled: false   # enable once an appname is approved: https://apidoc.reliefweb.int/parameters#appname
