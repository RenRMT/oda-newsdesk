name: update

on:
  schedule:
    - cron: "0 5,12,18 * * *"
  workflow_dispatch:
    inputs:
      backend:
        description: "LLM backend override (blank = config)"
        required: false
        default: ""
        type: choice
        options: ["", anthropic, ollama]
      no_llm:
        description: "Skip LLM enrichment"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: newsdesk
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Embedding model files rarely change: cache them under a fixed key.
      - uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-${{ hashFiles('config/settings.yaml') }}
          restore-keys: fastembed-

      # Item vectors change every run: save a new cache each run, restore the latest.
      - uses: actions/cache@v4
        with:
          path: .cache/vectors.npz
          key: vectors-${{ github.run_id }}
          restore-keys: vectors-

      - name: Fetch, enrich and build
        run: |
          args=""
          if [ "${{ inputs.no_llm }}" = "true" ]; then args="--no-llm"; fi
          if [ -n "${{ inputs.backend }}" ]; then args="$args --backend ${{ inputs.backend }}"; fi
          python -m newsdesk run $args
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RELIEFWEB_APPNAME: ${{ vars.RELIEFWEB_APPNAME }}

      - name: Commit data
        run: |
          git config user.name "newsdesk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
