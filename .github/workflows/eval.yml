name: eval

# Score an LLM backend against the hand labels in data/eval/labels.yaml.
# The report is shown in the run summary and committed to data/eval/reports/.
on:
  workflow_dispatch:
    inputs:
      backend:
        description: "LLM backend"
        required: true
        default: ollama
        type: choice
        options: [ollama, anthropic]
      model:
        description: "Model (blank = the configured enrich model), e.g. qwen3:4b or llama3.2:3b"
        required: false
        default: ""
      limit:
        description: "Only the first N labelled items (blank = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: newsdesk
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Resolve model
        id: llm
        run: |
          python -m newsdesk backend-info --backend ${{ inputs.backend }} >> "$GITHUB_OUTPUT"
          if [ -n "$MODEL" ]; then echo "model=$MODEL" >> "$GITHUB_OUTPUT"; fi
        env:
          MODEL: ${{ inputs.model }}

      - if: inputs.backend == 'ollama'
        uses: ./.github/actions/setup-ollama
        with:
          model: ${{ steps.llm.outputs.model }}

      - name: Run eval
        run: |
          args=(--backend "${{ inputs.backend }}" --model "$MODEL")
          if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          python -m newsdesk eval "${args[@]}" | tee "$RUNNER_TEMP/eval.txt"
          sed '$d' "$RUNNER_TEMP/eval.txt" >> "$GITHUB_STEP_SUMMARY"
        env:
          MODEL: ${{ steps.llm.outputs.model }}
          LIMIT: ${{ inputs.limit }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit report
        run: |
          git config user.name "newsdesk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/eval/reports/
          git diff --cached --quiet || git commit -m "eval: ${{ inputs.backend }} $MODEL"
          git pull --rebase && git push
        env:
          MODEL: ${{ steps.llm.outputs.model }}
